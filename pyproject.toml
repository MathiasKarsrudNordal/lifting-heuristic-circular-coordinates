[project]
name = "lifting-heuristic-circular-coordinates"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dreimac>=0.3.2",
    "icecream>=2.2.0",
    "isort>=8.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "persim>=0.3.8",
    "ripser>=0.6.15",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=62.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lifting_cocycles*"]

